version: 2.1
setup: true

# Define the job
jobs:
  generate-ci:
    docker:
      - image: cimg/python:3.12
    steps:
      - run:
          name: Install Dependencies
          command: pip install jinja2
      - run:
          name: Generate CI
          command: python .circleci/generate_ci.py
      - setup/config:
          name: Use Dynamic Config
          config-path: .circleci/dynamic-ci.yml


workflows:
  version: 2
  setup:
    jobs:
      - generate-ci
                
